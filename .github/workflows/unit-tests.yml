name: Unit Tests

on:
  push:
    paths:
      - utils/**
      - firebaseConfig.ts
      - firebase.ts
      - App.tsx
      - index.tsx
      - database.ts
      - types.ts
      - vite.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/unit-tests.yml
  pull_request:
    paths:
      - utils/**
      - firebaseConfig.ts
      - firebase.ts
      - App.tsx
      - index.tsx
      - database.ts
      - types.ts
      - vite.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/unit-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Root unit test suite (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # TM-16: SHA-pinned. Verify with:
      #   gh api repos/actions/checkout/git/ref/tags/v4.2.2 --jq .object.sha
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # TM-16: SHA-pinned. Verify with:
      #   gh api repos/actions/setup-node/git/ref/tags/v4 --jq .object.sha
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # npm 10 for cross-platform lockfile compatibility (consistent with avatar-pipeline.yml).
      - name: Install npm 10
        run: npm install -g npm@10

      - name: Install root dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
