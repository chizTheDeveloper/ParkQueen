<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2">
  <!-- 5 horizontal stripes: red/white/red/white/red -->
  <rect width="3" height="2" fill="#EF3340"/>
  <rect y=".4" width="3" height=".4" fill="#fff"/>
  <rect y="1.2" width="3" height=".4" fill="#fff"/>
  <!-- Blue equilateral triangle (base = flag height = 2, height = sqrt(3) ≈ 1.732) -->
  <polygon points="0,0 0,2 1.732,1" fill="#0F1F6E"/>
  <!-- White 5-pointed star at triangle centroid (~0.577, 1) -->
  <polygon points="0.577,0.615 0.490,0.878 0.216,0.884 0.434,1.046 0.354,1.308 0.577,1.151 0.800,1.308 0.720,1.046 0.938,0.884 0.664,0.878" fill="#fff"/>
</svg>
