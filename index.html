<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ParQueen - NYC Parking</title>
  <meta name="theme-color" content="#071426" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html,
    body,
    #root {
      height: 100%;
    }

    .sp-page {
      min-height: 100dvh;
    }

    .sp-overlay {
      pointer-events: none;
    }

    .sp-overlay>* {
      pointer-events: auto;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body {
      background-color: var(--color-bg);
      overscroll-behavior-y: none;
    }

    .mapboxgl-ctrl-bottom-left,
    .mapboxgl-ctrl-bottom-right {
      display: none;
    }
  </style>

  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react/": "https://esm.sh/react@18.2.0/",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.12.2?external=react,react-dom",
    "mapbox-gl": "https://esm.sh/mapbox-gl@2.14.1",
    "firebase/app": "https://esm.sh/firebase@10.14.1/app",
    "firebase/auth": "https://esm.sh/firebase@10.14.1/auth",
    "firebase/firestore": "https://esm.sh/firebase@10.14.1/firestore",
    "firebase/analytics": "https://esm.sh/firebase@10.14.1/analytics",
    "firebase/messaging": "https://esm.sh/firebase@10.14.1/messaging",
    "firebase/storage": "https://esm.sh/firebase@10.14.1/storage",
    "firebase/functions": "https://esm.sh/firebase@10.14.1/functions",
    "firebase/": "https://esm.sh/firebase@10.14.1/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>

<body class="bg-[var(--color-bg)] text-[var(--color-text)] overflow-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
